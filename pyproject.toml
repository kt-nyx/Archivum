[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivum"
version = "0.1.0"
description = "Foundational toolchain and scaffolding for Archivum"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
  "prefect>=3.4.0",
  "typer>=0.16.0",
  "jsonschema>=4.26.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "tenacity>=9.0",
  "beautifulsoup4>=4.13",
  "networkx>=3.3",
  "rapidfuzz>=3.9",
  # NLP substrate (generalization refactor Slice 4): deliberately exact-pinned — grammar
  # feature output must be reproducible across dev/CI, and the trained model below must
  # match this spaCy minor version. Bump both together, deliberately.
  "spacy==3.8.13",
  # The trained English pipeline is not published on PyPI; pin the GitHub release wheel
  # matching the pinned spaCy minor version. Standard dev/CI dependency: tests run real
  # segmentation/tagging, never a fallback.
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "types-jsonschema>=4.26.0.20260508",
  "types-PyYAML>=6.0",
]

[project.scripts]
archivum-pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"pipeline/data" = "pipeline/data"
