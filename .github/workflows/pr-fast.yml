name: pr-fast

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff
        run: uv run ruff check pipeline scripts tests .vscode/run-incrementing-pipeline.py

      - name: Mypy
        run: uv run mypy pipeline

      - name: Pytest
        run: uv run python -m pytest
